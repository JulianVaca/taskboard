# Blueprint de Render: recrea los tres servicios con un clic.
# Render → New → Blueprint → elegir el repositorio taskboard.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: taskboard-db
    plan: free
    region: virginia
    databaseName: taskboard
    user: taskboard

services:
  # Backend: API REST (Node.js + Express)
  - type: web
    name: taskboard-api
    runtime: node
    plan: free
    region: virginia
    branch: produccion
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - api.skillware.online
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: taskboard-db
          property: connectionString # Internal Database URL
      - key: DB_SSL
        value: "false"
      - key: FRONTEND_URL
        value: https://skillware.online,https://www.skillware.online,https://taskboard-web-56l3.onrender.com

  # Frontend: React + Vite como sitio estático
  - type: web
    name: taskboard-web
    runtime: static
    branch: produccion
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    domains:
      - skillware.online
      - www.skillware.online
    envVars:
      # URL pública del backend, sin barra final. Render la pide al crear el Blueprint.
      # Usa https://taskboard-api.onrender.com y, cuando el DNS esté activo, https://api.skillware.online
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
