<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TaskBoard: gestor de tareas full stack con React, Express y PostgreSQL desplegado en Render." />
    <meta name="theme-color" content="#29c5f6" />
    <meta property="og:title" content="TaskBoard" />
    <meta property="og:description" content="Organiza tu dÃ­a, una tarea a la vez." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TaskBoard</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo claro/oscuro.
      (function () {
        var t = "system";
        try { t = localStorage.getItem("taskboard-theme") || "system"; } catch (e) {}
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
